name: Claude review

on:
  pull_request:
    types: [labeled, synchronize]

jobs:
  review:
    # runs only when the `claude-review` label is added (by hand or by the board poll); a new push removes it, see the reset job
    # skip big PRs so one review can't eat the subscription quota (expressions can't add, so cap each side)
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.label.name == 'claude-review' && github.event.pull_request.additions <= 500 && github.event.pull_request.deletions <= 1000 && github.event.pull_request.changed_files <= 60
    # a newer review (new commit) replaces a running one that is already stale
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            Review this PR against CLAUDE.md and DESIGN.md. Focus on bugs, security and missing tests. Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for each concrete problem, anchored to the exact line. Then post one short summary with `gh pr comment`. Post at most 10 inline comments, only for problems you are sure about. Only comment on PR ${{ github.event.pull_request.number }}; never touch other PRs or issues. Only post GitHub comments.
          claude_args: '--max-turns 25 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment ${{ github.event.pull_request.number }}:*)"'

  reset:
    # a new commit makes the review stale; dropping the label lets the board poller request a fresh one
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'claude-review')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/claude-review" --silent
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
