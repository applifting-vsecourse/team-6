name: Claude review

on:
  pull_request:
    types: [opened]

jobs:
  review:
    # only PRs carrying the attribution line Claude adds to PR bodies
    if: contains(github.event.pull_request.body, 'Generated with [Claude Code]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            Review this PR against CLAUDE.md and DESIGN.md. Focus on bugs, security and missing tests. Post your findings as a PR comment.
          claude_args: '--allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"'
