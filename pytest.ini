[pytest]
testpaths = tests_selenium/tests
addopts = -v --tb=short
markers =
    mobile: phone tests, run on every size in conftest.PHONES
    ios: real Safari on the iOS Simulator with the real keyboard (test_13); needs --ios
filterwarnings =
    ignore:urllib3 v2 only supports OpenSSL:Warning
    ignore::DeprecationWarning
